# This rule is not used by the project gatewayapi-securitypolicy-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over securitypolicy.vitistack.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gatewayapi-securitypolicy-operator
    app.kubernetes.io/managed-by: kustomize
  name: cidrlist-admin-role
rules:
- apiGroups:
  - securitypolicy.vitistack.io
  resources:
  - cidrlists
  verbs:
  - '*'
- apiGroups:
  - securitypolicy.vitistack.io
  resources:
  - cidrlists/status
  verbs:
  - get
  - patch
  - update
