# [NAMESPACE]: Namespace where the operator will be deployed
namespace: gatewayapi-securitypolicy-system

# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
    image:
      repository: ncr.sky.nhn.no/ghcr/vitistack/gatewayapi-securitypolicy-operator
      tag: latest
    imagePullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: gatewayapi-securitypolicy-operator-controller-manager

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process. The CRDs are rendered from
  # templates/crd, so they are also updated on helm upgrade.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [NETWORK POLICIES]: Restrict ingress to the controller-manager pod.
# When true, a NetworkPolicy ("allow-metrics-traffic") is created that only
# allows traffic to the metrics port (8443/TCP) from namespaces labeled
# "metrics: enabled". All other ingress to the pod is denied.
# NOTE: Label your Prometheus namespace, otherwise scraping stops:
#   kubectl label namespace <prometheus-namespace> metrics=enabled
# NOTE: Requires a CNI that enforces NetworkPolicies (e.g. Calico, Cilium).
networkPolicy:
  enable: false
